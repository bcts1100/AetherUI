name: Native build and headless checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure VS2022 x64
        run: cmake -S . -B build-v03 -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=ON
      - name: Compile all native targets
        run: cmake --build build-v03 --config Release --parallel 4
      - name: Core, configuration, async status and measurement checks
        run: ctest --test-dir build-v03 -C Release --output-on-failure -R "^(Core.*|WindowsConfiguration|WindowsAsyncStatus|PerformanceScriptMath|GpuScriptMath|LongRunScriptMath)$"
      - name: Stage application
        run: cmake --install build-v03 --config Release --prefix package
      - uses: actions/upload-artifact@v4
        with:
          name: AetherUI-v0.9-preview-windows-x64
          path: package/
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel 4
      - run: ctest --test-dir build --output-on-failure
